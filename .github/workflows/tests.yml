name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install -r requirements.txt
      - name: Syntax and i18n checks
        run: |
          node tools/check_i18n.js
          node tools/i18n_uk.js check
      - name: JavaScript tests
        run: node --test
      - name: Python tests (dictionary-dependent tests skip without data/)
        run: python -m unittest discover -s tests -p "test_*.py"
