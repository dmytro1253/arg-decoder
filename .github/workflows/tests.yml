name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install -r requirements.txt
      - name: Syntax and i18n checks
        run: |
          node tools/check_i18n.js
          node tools/i18n_uk.js check
      - name: JavaScript tests
        run: node --test
      - name: Python tests (dictionary-dependent tests skip without data/)
        run: python -m unittest discover -s tests -p "test_*.py"

  # Полный Python-подбор с настоящими словарями: данные ставятся из релиза data-v1 (с проверкой SHA-256),
  # и без них проверка падает, а не пропускается. Отдельно от быстрых тестов выше.
  full-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install -r requirements.txt
      - name: Install dictionaries from the data-v1 release
        run: python setup_data.py --verify
      - name: Full engine tests (no skips allowed)
        env:
          ARGDEC_REQUIRE_DATA: "1"
        run: set -o pipefail; python -m unittest -v tests.test_backend 2>&1 | tee backend.log; grep -q "skipped" backend.log && { echo "Full engine tests were skipped"; exit 1; } || true
